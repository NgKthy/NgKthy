name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Chạy vào nửa đêm mỗi ngày
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: NgKthy
          template: classic
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          extras_css: |
            :root {
              --color-calendar-graph-day-L1-bg: #9ebef5 !important;
              --color-calendar-graph-day-L2-bg: #62a6f4 !important;
              --color-calendar-graph-day-L3-bg: #467ebf !important;
              --color-calendar-graph-day-L4-bg: #234f85 !important;
            }
            path[fill="#9be9a8"] { fill: #9ebef5 !important; }
            path[fill="#40c463"] { fill: #62a6f4 !important; }
            path[fill="#30a14e"] { fill: #467ebf !important; }
            path[fill="#216e39"] { fill: #234f85 !important; }

      - name: Top Languages
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: NgKthy
          template: classic
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%